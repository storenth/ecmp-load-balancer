name: Scheduled ECMP Testing

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:
    inputs:
      run_trend_analysis:
        description: 'Run trend analysis'
        required: false
        default: true
        type: boolean
      send_notifications:
        description: 'Send notifications on failure'
        required: false
        default: true
        type: boolean

env:
  CONFIG_FILE: config/test_config.yaml
  TOPOLOGY_FILE: topology/clab-ecmp-test.yml
  RESULTS_DIR: results
  VERBOSE: true

jobs:
  scheduled-tests:
    name: Scheduled Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install containerlab
        run: |
          curl -sL https://github.com/srl-labs/containerlab/releases/download/v0.50.0/containerlab_0.50.0_linux_amd64.deb -o containerlab.deb
          sudo dpkg -i containerlab.deb || sudo apt-get install -f -y
          containerlab version

      - name: Create results directory
        run: |
          mkdir -p ${{ env.RESULTS_DIR }}/{captures,analysis,reports,allure-results,trends}

      - name: Deploy topology
        run: |
          containerlab deploy -t ${{ env.TOPOLOGY_FILE }} --reconfigure
        timeout-minutes: 10

      - name: Wait for containers to be ready
        run: |
          echo "Waiting for containers to be ready..."
          sleep 30
          
          # Check if all containers are running
          docker ps --format "{{.Names}}" | grep -E "clab-ecmp" || exit 1
          
          # Wait for FRR to be ready
          for container in $(docker ps --format "{{.Names}}" | grep -E "r[1-6]"); do
            echo "Checking $container..."
            docker exec "$container" vtysh -c "show ip route" || exit 1
          done
        timeout-minutes: 5

      - name: Configure ECMP
        run: |
          bash scripts/configure_ecmp.sh \
            --config ${{ env.CONFIG_FILE }}
        env:
          VERBOSE: ${{ env.VERBOSE }}

      - name: Start traffic capture
        run: |
          bash scripts/capture_traffic.sh \
            --output ${{ env.RESULTS_DIR }}/captures \
            --duration 120
        env:
          VERBOSE: ${{ env.VERBOSE }}

      - name: Generate test traffic
        run: |
          python scripts/traffic_gen.py \
            --config ${{ env.CONFIG_FILE }} \
            --duration 120
        env:
          VERBOSE: ${{ env.VERBOSE }}

      - name: Stop traffic capture
        run: |
          pkill -f tcpdump || true
          echo "Traffic capture stopped"

      - name: Analyze results
        run: |
          python scripts/analyzer.py \
            --input ${{ env.RESULTS_DIR }}/captures \
            --output ${{ env.RESULTS_DIR }}/analysis
        env:
          VERBOSE: ${{ env.VERBOSE }}

      - name: Generate test results
        run: |
          bash scripts/run_test.sh \
            --config ${{ env.CONFIG_FILE }} \
            --output ${{ env.RESULTS_DIR }}
        env:
          VERBOSE: ${{ env.VERBOSE }}

      - name: Generate Allure report
        run: |
          bash scripts/generate_allure_report.sh \
            --input ${{ env.RESULTS_DIR }}/allure-results \
            --output ${{ env.RESULTS_DIR }}/reports/allure
        continue-on-error: true

      - name: Generate ISO 29119-3 report
        run: |
          python scripts/report_gen.py \
            --format iso29119 \
            --input ${{ env.RESULTS_DIR }}/analysis \
            --output ${{ env.RESULTS_DIR }}/reports/iso29119
        continue-on-error: true

      - name: Generate JSON report
        run: |
          python scripts/report_gen.py \
            --format json \
            --input ${{ env.RESULTS_DIR }}/analysis \
            --output ${{ env.RESULTS_DIR }}/reports/json

      - name: Generate HTML report
        run: |
          python scripts/report_gen.py \
            --format html \
            --input ${{ env.RESULTS_DIR }}/analysis \
            --output ${{ env.RESULTS_DIR }}/reports/html

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-test-results-${{ github.run_number }}
          path: |
            ${{ env.RESULTS_DIR }}/captures/
            ${{ env.RESULTS_DIR }}/analysis/
          retention-days: 30

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-reports-${{ github.run_number }}
          path: ${{ env.RESULTS_DIR }}/reports/
          retention-days: 30

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-allure-results-${{ github.run_number }}
          path: ${{ env.RESULTS_DIR }}/allure-results/
          retention-days: 30

  trend-analysis:
    name: Trend Analysis
    runs-on: ubuntu-latest
    needs: scheduled-tests
    if: github.event.inputs.run_trend_analysis == 'true' || github.event_name == 'schedule'
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download historical results
        uses: actions/download-artifact@v4
        with:
          pattern: scheduled-test-results-*
          path: ${{ env.RESULTS_DIR }}/historical/
          merge-multiple: true
        continue-on-error: true

      - name: Create trends directory
        run: |
          mkdir -p ${{ env.RESULTS_DIR }}/trends

      - name: Generate trend analysis
        run: |
          python scripts/analyzer.py \
            --input ${{ env.RESULTS_DIR }}/historical \
            --output ${{ env.RESULTS_DIR }}/trends \
            --trend-analysis
        env:
          VERBOSE: ${{ env.VERBOSE }}
        continue-on-error: true

      - name: Generate trend report
        run: |
          python scripts/report_gen.py \
            --format json \
            --input ${{ env.RESULTS_DIR }}/trends \
            --output ${{ env.RESULTS_DIR }}/trends/report \
            --trend-report
        continue-on-error: true

      - name: Upload trend analysis
        uses: actions/upload-artifact@v4
        with:
          name: trend-analysis-${{ github.run_number }}
          path: ${{ env.RESULTS_DIR }}/trends/
          retention-days: 90

      - name: Generate trend summary
        run: |
          echo "# Trend Analysis Summary" > ${{ env.RESULTS_DIR }}/trends/summary.md
          echo "" >> ${{ env.RESULTS_DIR }}/trends/summary.md
          echo "## Analysis Date" >> ${{ env.RESULTS_DIR }}/trends/summary.md
          echo "- **Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> ${{ env.RESULTS_DIR }}/trends/summary.md
          echo "- **Run Number:** ${{ github.run_number }}" >> ${{ env.RESULTS_DIR }}/trends/summary.md
          echo "" >> ${{ env.RESULTS_DIR }}/trends/summary.md
          echo "## Key Metrics" >> ${{ env.RESULTS_DIR }}/trends/summary.md
          echo "Trend analysis has been generated and uploaded as artifacts." >> ${{ env.RESULTS_DIR }}/trends/summary.md

      - name: Upload trend summary
        uses: actions/upload-artifact@v4
        with:
          name: trend-summary-${{ github.run_number }}
          path: ${{ env.RESULTS_DIR }}/trends/summary.md
          retention-days: 90

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: scheduled-tests
    if: always()
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install containerlab
        run: |
          curl -sL https://github.com/srl-labs/containerlab/releases/download/v0.50.0/containerlab_0.50.0_linux_amd64.deb -o containerlab.deb
          sudo dpkg -i containerlab.deb || sudo apt-get install -f -y

      - name: Destroy topology
        run: |
          containerlab destroy -t ${{ env.TOPOLOGY_FILE }} --cleanup || true
        continue-on-error: true

      - name: Clean up Docker resources
        run: |
          # Remove stopped containers
          docker container prune -f || true
          
          # Remove unused networks
          docker network prune -f || true
        continue-on-error: true

      - name: Verify cleanup
        run: |
          echo "Remaining containers:"
          docker ps -a || true
          echo ""
          echo "Remaining networks:"
          docker network ls || true

  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [scheduled-tests, trend-analysis]
    if: failure() && (github.event.inputs.send_notifications == 'true' || github.event_name == 'schedule')
    timeout-minutes: 5
    
    steps:
      - name: Generate failure notification
        run: |
          echo "# ❌ Scheduled Test Failed" > notification.md
          echo "" >> notification.md
          echo "## Details" >> notification.md
          echo "- **Workflow:** ${{ github.workflow }}" >> notification.md
          echo "- **Run Number:** ${{ github.run_number }}" >> notification.md
          echo "- **Triggered By:** ${{ github.event_name }}" >> notification.md
          echo "- **Failed At:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> notification.md
          echo "" >> notification.md
          echo "## Actions Required" >> notification.md
          echo "Please review the workflow logs and investigate the failure." >> notification.md
          echo "" >> notification.md
          echo "Workflow URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> notification.md

      - name: Create issue on failure
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const notification = fs.readFileSync('notification.md', 'utf8');
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `❌ Scheduled Test Failed - Run #${{ github.run_number }}`,
              body: notification,
              labels: ['bug', 'ci-failure', 'scheduled-test']
            });

      - name: Generate workflow summary
        run: |
          cat notification.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Review the workflow logs" >> $GITHUB_STEP_SUMMARY
          echo "2. Check the failed job details" >> $GITHUB_STEP_SUMMARY
          echo "3. Investigate the root cause" >> $GITHUB_STEP_SUMMARY
          echo "4. Fix the issue and push changes" >> $GITHUB_STEP_SUMMARY

  success-summary:
    name: Success Summary
    runs-on: ubuntu-latest
    needs: [scheduled-tests, trend-analysis]
    if: success()
    timeout-minutes: 5
    
    steps:
      - name: Generate success summary
        run: |
          echo "# ✅ Scheduled Tests Completed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow:** ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run Number:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered By:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Completed At:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Test results" >> $GITHUB_STEP_SUMMARY
          echo "- Reports (Allure, ISO 29119-3, JSON, HTML)" >> $GITHUB_STEP_SUMMARY
          echo "- Trend analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All artifacts are available for download for 30-90 days." >> $GITHUB_STEP_SUMMARY
