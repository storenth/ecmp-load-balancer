name: ECMP Testing CI/CD

# =============================================================================
# ECMP Testing CI/CD Pipeline
# =============================================================================
# This workflow implements a complete CI/CD pipeline for ECMP hash testing,
# including topology deployment, configuration, testing, analysis, and reporting.
#
# Reference: https://docs.github.com/en/actions
# Architecture: ARCHITECTURE.md - Testing Framework Architecture
# Best Practices: GitHub Actions Best Practices
#
# Triggers:
#   - Manual workflow dispatch (with configurable parameters)
#   - Scheduled runs (daily at 00:00 UTC)
#   - Push to main branch
#   - Pull requests to main branch
#
# Jobs:
#   - setup: Install dependencies and prepare environment
#   - deploy: Deploy Containerlab topology
#   - configure: Apply ECMP configuration
#   - test: Run traffic generation and capture
#   - analyze: Analyze results and generate reports
#   - report: Generate Allure report
#   - upload: Upload artifacts and reports
# =============================================================================

on:
  # Manual workflow dispatch with configurable parameters
  workflow_dispatch:
    inputs:
      test_scenario:
        description: 'Test scenario to execute'
        required: false
        default: 'basic_distribution'
        type: choice
        options:
          - basic_distribution
          - single_source
          - high_volume
          - burst_traffic
      test_duration:
        description: 'Test duration in seconds'
        required: false
        default: '60'
        type: string
      packet_count:
        description: 'Number of packets per source'
        required: false
        default: '1000'
        type: string
      cleanup_after_test:
        description: 'Cleanup topology after test'
        required: false
        default: true
        type: boolean
      generate_allure_report:
        description: 'Generate Allure report'
        required: false
        default: true
        type: boolean
      debug_mode:
        description: 'Enable debug mode (verbose logging)'
        required: false
        default: false
        type: boolean

  # Scheduled runs (daily at 00:00 UTC)
  schedule:
    - cron: '0 0 * * *'

  # Push to main branch
  push:
    branches:
      - main
      - develop
    paths:
      - 'scripts/**'
      - 'configs/**'
      - 'topology/**'
      - '.github/workflows/ecmp-test.yml'

  # Pull requests to main branch
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'scripts/**'
      - 'configs/**'
      - 'topology/**'
      - '.github/workflows/ecmp-test.yml'

# Environment variables
env:
  # Test configuration
  TEST_ID: ${{ github.run_number }}-${{ github.sha }}
  TEST_NAME: 'ECMP Hash Distribution Test'
  TEST_SUITE: 'ECMP Hash Testing Suite'
  
  # Directory configuration
  PROJECT_ROOT: ${{ github.workspace }}
  RESULTS_DIR: ${{ github.workspace }}/results
  CAPTURES_DIR: ${{ github.workspace }}/results/captures
  ANALYSIS_DIR: ${{ github.workspace }}/results/analysis
  REPORTS_DIR: ${{ github.workspace }}/results/reports
  ALLURE_RESULTS_DIR: ${{ github.workspace }}/results/allure-results
  ALLURE_REPORT_DIR: ${{ github.workspace }}/results/allure-report
  LOGS_DIR: ${{ github.workspace }}/logs
  
  # Analysis thresholds
  MIN_PACKETS_PER_PATH: 100
  MAX_VARIANCE_PERCENT: 15
  CHI_SQUARE_SIGNIFICANCE: 0.05
  
  # Containerlab configuration
  TOPOLOGY_FILE: ${{ github.workspace }}/topology/clab-ecmp-test.yml
  
  # Traffic configuration
  TRAFFIC_CONFIG: ${{ github.workspace }}/configs/traffic/traffic_config.yaml

# Jobs
jobs:
  # =============================================================================
  # Setup Job: Install dependencies and prepare environment
  # =============================================================================
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scipy numpy pandas matplotlib seaborn
          pip install pyyaml
          pip install jq
      
      - name: Install Containerlab
        run: |
          curl -sL https://containerlab.dev/install.sh | sudo -E bash -
          clab version
      
      - name: Install FRRouting
        run: |
          sudo apt-get update
          sudo apt-get install -y frr frr-pythontools
      
      - name: Install network tools
        run: |
          sudo apt-get install -y tcpdump hping3 iputils-ping
          sudo apt-get install -y net-tools iproute2
          sudo apt-get install -y bc jq yq
      
      - name: Install Allure
        run: |
          sudo apt-get install -y openjdk-11-jdk
          wget https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
          sudo tar -zxvf allure-2.24.0.tgz -C /opt/
          sudo ln -s /opt/allure-2.24.0/bin/allure /usr/local/bin/allure
          allure --version
      
      - name: Create required directories
        run: |
          mkdir -p "${{ env.RESULTS_DIR }}"
          mkdir -p "${{ env.CAPTURES_DIR }}"
          mkdir -p "${{ env.ANALYSIS_DIR }}"
          mkdir -p "${{ env.REPORTS_DIR }}"
          mkdir -p "${{ env.ALLURE_RESULTS_DIR }}"
          mkdir -p "${{ env.ALLURE_REPORT_DIR }}"
          mkdir -p "${{ env.LOGS_DIR }}"
          mkdir -p "${{ env.RESULTS_DIR }}/archives"
      
      - name: Verify Docker installation
        run: |
          docker --version
          docker ps
      
      - name: Verify dependencies
        run: |
          echo "=== Checking installed tools ==="
          echo "Containerlab: $(clab version 2>&1 | head -1)"
          echo "Python: $(python --version)"
          echo "tcpdump: $(tcpdump --version | head -1)"
          echo "hping3: $(hping3 --version 2>&1 | head -1)"
          echo "Allure: $(allure --version)"
          echo "jq: $(jq --version)"
          echo "bc: $(bc --version | head -1)"
          echo "yq: $(yq --version)"
          echo "=== All dependencies verified ==="
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.local/share/containerlab
          key: ${{ runner.os }}-deps-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-deps-
      
      - name: Upload setup artifacts
        uses: actions/upload-artifact@v4
        with:
          name: setup-artifacts
          path: |
            ${{ env.LOGS_DIR }}/
          retention-days: 1
          if-no-files-found: ignore

  # =============================================================================
  # Deploy Job: Deploy Containerlab topology
  # =============================================================================
  deploy:
    name: Deploy Topology
    runs-on: ubuntu-latest
    needs: setup
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download setup artifacts
        uses: actions/download-artifact@v4
        with:
          name: setup-artifacts
          path: ${{ env.LOGS_DIR }}
          continue-on-error: true
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Containerlab
        run: |
          curl -sL https://containerlab.dev/install.sh | sudo -E bash -
      
      - name: Validate topology file
        run: |
          echo "=== Validating topology file ==="
          if [[ ! -f "${{ env.TOPOLOGY_FILE }}" ]]; then
            echo "ERROR: Topology file not found"
            exit 1
          fi
          echo "Topology file found: ${{ env.TOPOLOGY_FILE }}"
          yq eval '.' "${{ env.TOPOLOGY_FILE }}" > /dev/null
          echo "Topology file is valid YAML"
      
      - name: Deploy Containerlab topology
        run: |
          echo "=== Deploying ECMP topology ==="
          cd "${{ env.PROJECT_ROOT }}"
          bash scripts/deploy_topology.sh --verbose 2>&1 | tee "${{ env.LOGS_DIR }}/deploy.log"
      
      - name: Verify deployment
        run: |
          echo "=== Verifying deployment ==="
          # Check if all containers are running
          expected_containers=("h1" "h2" "h3" "h4" "r1" "r2" "r3" "r4" "r5" "r6" "d1")
          running_count=0
          
          for container in "${expected_containers[@]}"; do
            if docker ps --format '{{.Names}}' | grep -q "clab-ecmp-test-${container}$"; then
              echo "✓ Container ${container} is running"
              ((running_count++))
            else
              echo "✗ Container ${container} is NOT running"
            fi
          done
          
          echo "Running containers: ${running_count}/${#expected_containers[@]}"
          
          if [[ ${running_count} -ne ${#expected_containers[@]} ]]; then
            echo "ERROR: Not all containers are running"
            docker ps -a
            exit 1
          fi
          
          echo "=== All containers verified ==="
      
      - name: Display topology status
        run: |
          echo "=== Topology Status ==="
          docker ps --filter "name=clab-ecmp-test-" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          echo ""
          echo "=== Network Interfaces (R1) ==="
          docker exec clab-ecmp-test-r1 ip addr show 2>/dev/null || true
      
      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          path: |
            ${{ env.LOGS_DIR }}/deploy.log
          retention-days: 7
          if-no-files-found: warn

  # =============================================================================
  # Configure Job: Apply ECMP configuration
  # =============================================================================
  configure:
    name: Configure ECMP
    runs-on: ubuntu-latest
    needs: deploy
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download deployment artifacts
        uses: actions/download-artifact@v4
        with:
          name: deployment-artifacts
          path: ${{ env.LOGS_DIR }}
          continue-on-error: true
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Containerlab
        run: |
          curl -sL https://containerlab.dev/install.sh | sudo -E bash -
      
      - name: Configure ECMP on routers
        run: |
          echo "=== Configuring ECMP ==="
          cd "${{ env.PROJECT_ROOT }}"
          bash scripts/configure_ecmp.sh --verbose 2>&1 | tee "${{ env.LOGS_DIR }}/configure.log"
      
      - name: Verify ECMP configuration
        run: |
          echo "=== Verifying ECMP Configuration ==="
          
          # Check ECMP routes on edge router
          echo "ECMP Routes on R1:"
          docker exec clab-ecmp-test-r1 vtysh -c "show ip route 192.168.100.0/24" || true
          
          # Check kernel ECMP hash configuration
          echo ""
          echo "Kernel ECMP Configuration:"
          docker exec clab-ecmp-test-r1 sysctl net.ipv4.fib_multipath_hash_policy
          docker exec clab-ecmp-test-r1 sysctl net.ipv4.fib_multipath_use_permanent_addr
          
          # Verify connectivity
          echo ""
          echo "Connectivity Test:"
          if docker exec clab-ecmp-test-r1 ping -c 1 -W 2 192.168.100.10 &> /dev/null; then
            echo "✓ Connectivity to destination verified"
          else
            echo "✗ Cannot reach destination"
            exit 1
          fi
          
          echo "=== ECMP configuration verified ==="
      
      - name: Upload configuration artifacts
        uses: actions/upload-artifact@v4
        with:
          name: configuration-artifacts
          path: |
            ${{ env.LOGS_DIR }}/configure.log
          retention-days: 7
          if-no-files-found: warn

  # =============================================================================
  # Test Job: Run traffic generation and capture
  # =============================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: configure
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download configuration artifacts
        uses: actions/download-artifact@v4
        with:
          name: configuration-artifacts
          path: ${{ env.LOGS_DIR }}
          continue-on-error: true
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scipy numpy pandas
      
      - name: Install network tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tcpdump hping3 iputils-ping bc jq yq
      
      - name: Install Containerlab
        run: |
          curl -sL https://containerlab.dev/install.sh | sudo -E bash -
      
      - name: Create test directories
        run: |
          mkdir -p "${{ env.CAPTURES_DIR }}"
          mkdir -p "${{ env.LOGS_DIR }}"
      
      - name: Start traffic captures
        run: |
          echo "=== Starting Traffic Captures ==="
          cd "${{ env.PROJECT_ROOT }}"
          bash scripts/capture_traffic.sh \
            --config "${{ env.TRAFFIC_CONFIG }}" \
            --duration ${{ github.event.inputs.test_duration || 70 }} \
            --verbose 2>&1 | tee "${{ env.LOGS_DIR }}/capture.log"
      
      - name: Generate test traffic
        run: |
          echo "=== Generating Test Traffic ==="
          cd "${{ env.PROJECT_ROOT }}"
          bash scripts/generate_traffic.sh \
            --config "${{ env.TRAFFIC_CONFIG }}" \
            --scenario ${{ github.event.inputs.test_scenario || 'basic_distribution' }} \
            --count ${{ github.event.inputs.packet_count || 1000 }} \
            --verbose 2>&1 | tee "${{ env.LOGS_DIR }}/traffic.log"
      
      - name: Verify capture files
        run: |
          echo "=== Verifying Capture Files ==="
          capture_count=$(find "${{ env.CAPTURES_DIR }}" -name "*.pcap" | wc -l)
          echo "Found ${capture_count} capture files"
          
          if [[ ${capture_count} -eq 0 ]]; then
            echo "ERROR: No capture files found"
            exit 1
          fi
          
          # Display capture file information
          for pcap in "${{ env.CAPTURES_DIR }}"/*.pcap; do
            if [[ -f "$pcap" ]]; then
              size=$(stat -c%s "$pcap")
              echo "✓ $(basename $pcap): ${size} bytes"
            fi
          done
          
          echo "=== Capture files verified ==="
      
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            ${{ env.CAPTURES_DIR }}/
            ${{ env.LOGS_DIR }}/capture.log
            ${{ env.LOGS_DIR }}/traffic.log
          retention-days: 7
          if-no-files-found: warn

  # =============================================================================
  # Analyze Job: Analyze results and generate reports
  # =============================================================================
  analyze:
    name: Analyze Results
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-artifacts
          path: ${{ env.RESULTS_DIR }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scipy numpy pandas matplotlib seaborn
          pip install pyyaml
      
      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tcpdump bc jq yq
      
      - name: Create analysis directories
        run: |
          mkdir -p "${{ env.ANALYSIS_DIR }}"
          mkdir -p "${{ env.REPORTS_DIR }}"
          mkdir -p "${{ env.LOGS_DIR }}"
      
      - name: Analyze test results
        run: |
          echo "=== Analyzing Test Results ==="
          cd "${{ env.PROJECT_ROOT }}"
          
          # Set environment variables for analysis
          export TEST_ID="${{ env.TEST_ID }}"
          export TEST_NAME="${{ env.TEST_NAME }}"
          export TEST_SCENARIO="${{ github.event.inputs.test_scenario || 'basic_distribution' }}"
          export MIN_PACKETS_PER_PATH="${{ env.MIN_PACKETS_PER_PATH }}"
          export MAX_VARIANCE_PERCENT="${{ env.MAX_VARIANCE_PERCENT }}"
          export CHI_SQUARE_SIGNIFICANCE="${{ env.CHI_SQUARE_SIGNIFICANCE }}"
          
          bash scripts/analyze_results.sh \
            --captures "${{ env.CAPTURES_DIR }}" \
            --output "${{ env.ANALYSIS_DIR }}" \
            --test-id "${{ env.TEST_ID }}" \
            --test-name "${{ env.TEST_NAME }}" \
            --scenario "${TEST_SCENARIO}" \
            --verbose 2>&1 | tee "${{ env.LOGS_DIR }}/analyze.log"
      
      - name: Display analysis results
        run: |
          echo "=== Analysis Results ==="
          
          if [[ -f "${{ env.ANALYSIS_DIR }}/${{ env.TEST_ID }}_statistics.txt" ]]; then
            cat "${{ env.ANALYSIS_DIR }}/${{ env.TEST_ID }}_statistics.txt"
          else
            echo "WARNING: Statistics file not found"
          fi
          
          echo ""
          echo "=== Analysis Complete ==="
      
      - name: Upload analysis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: analysis-artifacts
          path: |
            ${{ env.ANALYSIS_DIR }}/
            ${{ env.REPORTS_DIR }}/
            ${{ env.LOGS_DIR }}/analyze.log
          retention-days: 30
          if-no-files-found: warn

  # =============================================================================
  # Report Job: Generate Allure report
  # =============================================================================
  report:
    name: Generate Report
    runs-on: ubuntu-latest
    needs: analyze
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download analysis artifacts
        uses: actions/download-artifact@v4
        with:
          name: analysis-artifacts
          path: ${{ env.RESULTS_DIR }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scipy numpy pandas
          pip install pyyaml
      
      - name: Install Allure
        run: |
          sudo apt-get install -y openjdk-11-jdk
          wget https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
          sudo tar -zxvf allure-2.24.0.tgz -C /opt/
          sudo ln -s /opt/allure-2.24.0/bin/allure /usr/local/bin/allure
          allure --version
      
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      
      - name: Create report directories
        run: |
          mkdir -p "${{ env.ALLURE_RESULTS_DIR }}"
          mkdir -p "${{ env.ALLURE_REPORT_DIR }}"
          mkdir -p "${{ env.LOGS_DIR }}"
      
      - name: Generate Allure report
        run: |
          echo "=== Generating Allure Report ==="
          cd "${{ env.PROJECT_ROOT }}"
          
          # Set environment variables for report generation
          export TEST_ID="${{ env.TEST_ID }}"
          export TEST_NAME="${{ env.TEST_NAME }}"
          export TEST_SUITE="${{ env.TEST_SUITE }}"
          export TEST_SCENARIO="${{ github.event.inputs.test_scenario || 'basic_distribution' }}"
          export MIN_PACKETS_PER_PATH="${{ env.MIN_PACKETS_PER_PATH }}"
          export MAX_VARIANCE_PERCENT="${{ env.MAX_VARIANCE_PERCENT }}"
          
          bash scripts/generate_allure_report.sh \
            --results "${{ env.ALLURE_RESULTS_DIR }}" \
            --output "${{ env.ALLURE_REPORT_DIR }}" \
            --analysis "${{ env.ANALYSIS_DIR }}" \
            --test-id "${{ env.TEST_ID }}" \
            --test-name "${{ env.TEST_NAME }}" \
            --suite "${{ env.TEST_SUITE }}" \
            --verbose 2>&1 | tee "${{ env.LOGS_DIR }}/report.log"
      
      - name: Display report summary
        run: |
          echo "=== Report Summary ==="
          echo "Allure Results: ${{ env.ALLURE_RESULTS_DIR }}"
          echo "Allure Report: ${{ env.ALLURE_REPORT_DIR }}/index.html"
          
          if [[ -d "${{ env.ALLURE_REPORT_DIR }}" ]]; then
            echo "✓ Report generated successfully"
            ls -lh "${{ env.ALLURE_REPORT_DIR }}"
          else
            echo "✗ Report generation failed"
            exit 1
          fi
          
          echo "=== Report Generation Complete ==="
      
      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: |
            ${{ env.ALLURE_REPORT_DIR }}/
            ${{ env.ALLURE_RESULTS_DIR }}/
            ${{ env.LOGS_DIR }}/report.log
          retention-days: 30
          if-no-files-found: warn

  # =============================================================================
  # Upload Job: Upload artifacts and reports
  # =============================================================================
  upload:
    name: Upload Artifacts
    runs-on: ubuntu-latest
    needs: [report, analyze]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ env.RESULTS_DIR }}
      
      - name: Create archive
        run: |
          echo "=== Creating Test Archive ==="
          cd "${{ env.RESULTS_DIR }}"
          
          # Create timestamped archive
          archive_name="ecmp-test-${{ env.TEST_ID }}.tar.gz"
          tar -czf "${archive_name}" \
            captures/ \
            analysis/ \
            reports/ \
            allure-results/ \
            allure-report/ \
            logs/
          
          echo "Archive created: ${archive_name}"
          ls -lh "${archive_name}"
      
      - name: Upload complete archive
        uses: actions/upload-artifact@v4
        with:
          name: ecmp-test-complete-archive
          path: ${{ env.RESULTS_DIR }}/ecmp-test-*.tar.gz
          retention-days: 90
          if-no-files-found: warn
      
      - name: Generate test summary
        run: |
          echo "=== ECMP Test Summary ===" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Test ID:** ${{ env.TEST_ID }}" >> $GITHUB_STEP_SUMMARY
          echo "**Test Scenario:** ${{ github.event.inputs.test_scenario || 'basic_distribution' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Test Duration:** ${{ github.event.inputs.test_duration || 60 }}s" >> $GITHUB_STEP_SUMMARY
          echo "**Packet Count:** ${{ github.event.inputs.packet_count || 1000 }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Artifacts:**" >> $GITHUB_STEP_SUMMARY
          echo "- Complete Archive: Available for 90 days" >> $GITHUB_STEP_SUMMARY
          echo "- Allure Report: Available for 30 days" >> $GITHUB_STEP_SUMMARY
          echo "- Analysis Results: Available for 30 days" >> $GITHUB_STEP_SUMMARY
      
      - name: Cleanup topology
        if: ${{ github.event.inputs.cleanup_after_test != 'false' }}
        run: |
          echo "=== Cleaning Up Topology ==="
          cd "${{ env.PROJECT_ROOT }}"
          
          if [[ -f "${{ env.TOPOLOGY_FILE }}" ]]; then
            clab destroy -t "${{ env.TOPOLOGY_FILE }}" --cleanup || true
            echo "Topology cleaned up"
          else
            echo "Topology file not found, skipping cleanup"
          fi
          
          # Stop all containers
          docker ps -q --filter "name=clab-ecmp-test-" | xargs -r docker stop || true
          docker ps -aq --filter "name=clab-ecmp-test-" | xargs -r docker rm || true
          
          echo "=== Cleanup Complete ==="
      
      - name: Final status check
        run: |
          echo "=== Final Status Check ==="
          echo "Workflow Status: ${{ job.status }}"
          echo "All jobs completed successfully"
          
          # Display disk usage
          df -h
          
          echo "=== Workflow Complete ==="

  # =============================================================================
  # Notify Job: Send notifications (optional)
  # =============================================================================
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: upload
    if: always()
    
    steps:
      - name: Check workflow status
        run: |
          echo "Workflow Status: ${{ job.status }}"
          echo "Previous Jobs Status:"
          echo "- Setup: ${{ needs.setup.result }}"
          echo "- Deploy: ${{ needs.deploy.result }}"
          echo "- Configure: ${{ needs.configure.result }}"
          echo "- Test: ${{ needs.test.result }}"
          echo "- Analyze: ${{ needs.analyze.result }}"
          echo "- Report: ${{ needs.report.result }}"
          echo "- Upload: ${{ needs.upload.result }}"
      
      - name: Create status badge
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: |
          echo "Creating status badge..."
          # Status badge can be added here if needed
          echo "Status badge creation skipped (not implemented)"
