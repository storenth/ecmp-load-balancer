!
! FRRouting Configuration for Edge Router (R1)
! This router implements ECMP with 4 equal-cost paths to the destination network
!
! Reference: https://docs.frrouting.org/
! Architecture: ARCHITECTURE.md
!

frr version 8.4_git
frr defaults traditional
hostname ecmp-edge-router-r1
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!

! Interface configurations
interface eth0
 description Source Network Interface
 ip address 10.0.1.1/24
!

interface eth1
 description ECMP Path 1 to Core Router R2
 ip address 10.0.2.1/24
!

interface eth2
 description ECMP Path 2 to Core Router R3
 ip address 10.0.3.1/24
!

interface eth3
 description ECMP Path 3 to Core Router R4
 ip address 10.0.4.1/24
!

interface eth4
 description ECMP Path 4 to Core Router R5
 ip address 10.0.5.1/24
!

interface lo
 description Loopback Interface
 ip address 10.0.1.1/32
!

! OSPF Configuration
router ospf
 ospf router-id 10.0.1.1
 network 10.0.1.0/24 area 0

 network 10.0.2.0/24 area 0

 network 10.0.3.0/24 area 0

 network 10.0.4.0/24 area 0

 network 10.0.5.0/24 area 0

 passive-interface eth0
!

! Static Routes for ECMP
! These 4 routes have equal cost (metric 100) to enable ECMP

ip route 192.168.100.0/24 10.0.2.2 100

ip route 192.168.100.0/24 10.0.3.2 100

ip route 192.168.100.0/24 10.0.4.2 100

ip route 192.168.100.0/24 10.0.5.2 100

!

! BGP Configuration with ECMP support
router bgp 65001
 bgp router-id 10.0.1.1

 neighbor 10.0.2.2 remote-as 65002

 neighbor 10.0.3.2 remote-as 65002

 neighbor 10.0.4.2 remote-as 65002

 neighbor 10.0.5.2 remote-as 65002

!
 address-family ipv4 unicast

  neighbor 10.0.2.2 activate

  neighbor 10.0.3.2 activate

  neighbor 10.0.4.2 activate

  neighbor 10.0.5.2 activate

  maximum-paths 4
 exit-address-family
!

! Zebra Configuration for ECMP Hash Policy
ip multipath hash-policy src-ip
!

! Line configuration
line vty
!