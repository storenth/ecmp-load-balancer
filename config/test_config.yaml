# =============================================================================
# Master Test Configuration for ECMP Hash Validation
# =============================================================================
#
# This is the master configuration file that serves as the single entry point
# for all test configuration in the ECMP hash validation project.
#
# Purpose:
#   - Provide a centralized configuration source for all test scenarios
#   - Maintain backward compatibility with existing modular configs
#   - Enable easy extension for new test scenarios and parameters
#   - Support multiple test environments and configurations
#
# Architecture:
#   This master config references and extends existing modular configurations:
#   - configs/traffic/traffic_config.yaml: Traffic generation parameters
#   - configs/allure/allure_config.yaml: Allure reporting configuration
#   - topology/clab-ecmp-*.yml: Network topology definitions
#
# Usage:
#   This configuration can be used directly by test scripts or as a template
#   for environment-specific overrides. Scripts should load this config first,
#   then apply any environment-specific overrides.
#
# Validation Rules:
#   - All IP addresses must be valid IPv4 addresses
#   - Port numbers must be in range 1-65535
#   - Percentages must be in range 0-100
#   - Duration values must be positive integers
#   - Confidence levels must be in range 0-1
#
# Reference:
#   - ARCHITECTURE.md: Overall system architecture
#   - docs/TEST_PLAN.md: Detailed test plan
#   - RFC 2991: Multipath Issues in Unicast and Multicast Next-Hop Selection
#   - RFC 2992: Analysis of an Equal-Cost Multi-Path Algorithm
#
# =============================================================================

# =============================================================================
# TEST METADATA SECTION
# =============================================================================
# High-level test metadata for identification and tracking
test:
  # Test identifier - must be unique across the project
  # Format: <component>-<feature>-<variant>
  name: "ecmp-hash-source-ip-validation"
  
  # Configuration version - follows semantic versioning (MAJOR.MINOR.PATCH)
  # MAJOR: Breaking changes to configuration structure
  # MINOR: New features or parameters added
  # PATCH: Bug fixes or documentation updates
  version: "1.0.0"
  
  # Human-readable description of the test purpose
  description: |
    Validates ECMP hash behavior using Source IP address as the hash key.
    This test ensures that traffic from different source IPs is distributed
    across multiple ECMP paths according to the configured hash policy.
  
  # Test author or organization
  author: "Network Testing Team"
  
  # Creation date in ISO 8601 format (YYYY-MM-DD)
  created: "2026-03-06"
  
  # Test duration in seconds
  # Default: 60 seconds (1 minute)
  # Recommended: 60-300 seconds for statistical significance
  duration_sec: 60
  
  # Number of test iterations for statistical significance
  # Default: 5 iterations
  # Recommended: 3-10 iterations depending on required confidence
  iterations: 5
  
  # Delay between iterations in seconds
  # Default: 10 seconds
  # Purpose: Allow system to stabilize between iterations
  iteration_delay_sec: 10
  
  # Enable verbose logging for debugging
  # Default: false
  # Recommended: true during development, false in production
  verbose: false
  
  # Base output directory for all test results
  # Relative to project root
  # Default: "results"
  output_dir: "results"

# =============================================================================
# TOPOLOGY CONFIGURATION SECTION
# =============================================================================
# Network topology and device configuration
topology:
  # Name of the ECMP router in the topology
  # Must match the container name in clab topology file
  ecmp_router: "ecmp-router"
  
  # Name of the traffic generator host
  # Must match the container name in clab topology file
  traffic_gen: "traffic-gen"
  
  # Destination network CIDR notation
  # This is the network behind the ECMP router
  # Format: x.x.x.x/yy where yy is prefix length
  dst_network: "10.0.10.0/30"
  
  # Destination IP address for traffic
  # Must be within dst_network
  # This is the IP that receives all test traffic
  dst_ip: "10.0.10.10"
  
  # Number of ECMP paths in the topology
  # Must match the number of next-hop routers configured
  # Supported values: 2, 3, 4
  expected_paths: 4
  
  # Path to the container lab topology file
  # Relative to project root
  # Available options:
  #   - topology/clab-ecmp-2paths.yml (2 ECMP paths)
  #   - topology/clab-ecmp-3paths.yml (3 ECMP paths)
  #   - topology/clab-ecmp-4paths.yml (4 ECMP paths)
  #   - topology/clab-ecmp-test.yml (default 4-path topology)
  topology_file: "topology/clab-ecmp-test.yml"
  
  # List of next-hop routers in the ECMP group
  # These are the routers that form the ECMP paths
  next_hops:
    - name: "r2"
      ip: "10.0.2.2"
      container: "clab-ecmp-test-r2"
      interface: "eth0"
      enabled: true
    
    - name: "r3"
      ip: "10.0.3.2"
      container: "clab-ecmp-test-r3"
      interface: "eth0"
      enabled: true
    
    - name: "r4"
      ip: "10.0.4.2"
      container: "clab-ecmp-test-r4"
      interface: "eth0"
      enabled: true
    
    - name: "r5"
      ip: "10.0.5.2"
      container: "clab-ecmp-test-r5"
      interface: "eth0"
      enabled: true

# =============================================================================
# TRAFFIC GENERATION SECTION
# =============================================================================
# Traffic generation parameters and tool configuration
traffic:
  # Source IP range for traffic generation
  # Format: "start_ip-end_ip" or "start_ip/count"
  # Example: "192.168.1.10-192.168.1.50" (41 IPs)
  # Example: "192.168.1.10/32" (single IP)
  src_ip_range: "10.0.1.10-10.0.1.13"
  
  # Number of packets to send per source IP
  # Higher values provide better statistical significance
  # Default: 100 packets
  # Recommended: 100-1000 packets depending on test duration
  packets_per_src: 1000
  
  # Protocol type for generated traffic
  # Supported values: "icmp", "tcp", "udp"
  # Default: "tcp"
  protocol: "tcp"
  
  # Interval between packets in milliseconds
  # Lower values = higher traffic rate
  # Default: 10ms (100 packets per second)
  # Recommended: 1-100ms depending on network capacity
  interval_ms: 10
  
  # Test duration in seconds
  # Should match or exceed test.duration_sec
  # Default: 60 seconds
  duration_sec: 60
  
  # Destination IP address for traffic
  # Must match topology.dst_ip
  destination_ip: "10.0.10.10"
  
  # Destination port for TCP/UDP traffic
  # Ignored for ICMP traffic
  # Default: 80 (HTTP)
  # Common values: 80 (HTTP), 443 (HTTPS), 22 (SSH)
  destination_port: 80
  
  # Source port for TCP/UDP traffic
  # 0 = random source port (recommended for hash testing)
  # Default: 0
  source_port: 0
  
  # Packet size in bytes (excluding headers)
  # Default: 100 bytes
  # Recommended: 64-1500 bytes depending on test requirements
  packet_size_bytes: 100
  
  # TTL (Time To Live) value for IP packets
  # Default: 64 (typical for Linux systems)
  # Range: 1-255
  ttl: 64
  
  # Traffic generation tool configuration
  tool:
    # Tool to use for traffic generation
    # Supported values: "hping3", "ping", "iperf3"
    # Default: "hping3"
    name: "hping3"
    
    # hping3 specific parameters
    hping3:
      # TCP flags for SYN packets
      # Common values: "S" (SYN), "A" (ACK), "F" (FIN), "R" (RST)
      # Default: "S"
      flags: "S"
      
      # Flood mode (send packets as fast as possible)
      # WARNING: Can overwhelm network - use with caution
      # Default: false
      flood: false
    
    # ping specific parameters
    ping:
      # Ping interval in seconds
      # Default: 0.01 (10ms)
      interval_sec: 0.01
    
    # iperf3 specific parameters
    iperf3:
      # Bandwidth limit in bits per second
      # 0 = unlimited
      # Default: 0
      bandwidth_bps: 0
      
      # Number of parallel streams
      # Default: 1
      streams: 1

# =============================================================================
# ECMP CONFIGURATION SECTION
# =============================================================================
# ECMP-specific parameters and hash policy configuration
ecmp:
  # Hash algorithm used for ECMP path selection
  # Supported values:
  #   - "src-ip": Hash based on source IP only
  #   - "dst-ip": Hash based on destination IP only
  #   - "src-dst-ip": Hash based on source and destination IP
  #   - "5-tuple": Hash based on 5-tuple (src IP, dst IP, src port, dst port, protocol)
  # Default: "src-ip"
  hash_policy: "src-ip"
  
  # Number of expected ECMP paths
  # Must match topology.expected_paths
  # Default: 4
  expected_paths: 4
  
  # Acceptable deviation from uniform distribution in percentage
  # Example: 10% means each path can deviate by ±10% from ideal
  # Default: 10%
  # Recommended: 5-15% depending on required precision
  tolerance_percent: 10.0
  
  # Minimum packets per path for statistical significance
  # Paths with fewer packets will be flagged as insufficient
  # Default: 100 packets
  # Recommended: 50-500 packets depending on test scale
  min_packets_per_path: 100
  
  # Enable path stickiness validation
  # Ensures packets from same flow use same path
  # Default: true
  enable_stickiness_check: true
  
  # Stickiness threshold in percentage
  # Minimum percentage of packets from same flow that must use same path
  # Default: 95%
  # Recommended: 90-99%
  stickiness_threshold_percent: 95.0
  
  # Hash seed value (if applicable)
  # Some implementations use a seed for hash calculation
  # Default: 0 (no seed)
  hash_seed: 0

# =============================================================================
# ANALYSIS CONFIGURATION SECTION
# =============================================================================
# Parameters for statistical analysis and result validation
analysis:
  # Minimum total packets required for analysis
  # Tests with fewer packets will be marked as insufficient
  # Default: 1000 packets
  # Recommended: 500-10000 packets depending on test requirements
  min_packets: 1000
  
  # Minimum unique source IPs required for analysis
  # Ensures sufficient diversity in traffic sources
  # Default: 4 IPs
  # Recommended: 2-10 IPs depending on test scenario
  min_unique_src_ips: 4
  
  # Path stickiness threshold in percentage
  # Same as ecmp.stickiness_threshold_percent
  # Default: 95%
  stickiness_threshold_percent: 95.0
  
  # Maximum acceptable deviation from ideal balance
  # Same as ecmp.tolerance_percent
  # Default: 10%
  balance_deviation_threshold_percent: 10.0
  
  # Statistical confidence level
  # 0.95 = 95% confidence level
  # Default: 0.95
  # Recommended: 0.90-0.99
  confidence_level: 0.95
  
  # Enable chi-square test for distribution uniformity
  # Tests if observed distribution matches expected uniform distribution
  # Default: true
  enable_chi_square: true
  
  # Chi-square critical value for given confidence level and degrees of freedom
  # For 4 paths at 95% confidence: 7.815
  # For 3 paths at 95% confidence: 5.991
  # For 2 paths at 95% confidence: 3.841
  # Default: 7.815 (4 paths, 95% confidence)
  chi_square_critical: 7.815
  
  # Enable Kolmogorov-Smirnov test
  # Non-parametric test for distribution comparison
  # Default: false
  enable_ks_test: false
  
  # Enable trend analysis across iterations
  # Detects patterns or drifts in ECMP behavior over time
  # Default: true
  enable_trend_analysis: true
  
  # Enable outlier detection
  # Identifies anomalous paths or traffic patterns
  # Default: true
  enable_outlier_detection: true
  
  # Outlier detection method
  # Supported values: "iqr", "zscore", "isolation_forest"
  # Default: "iqr" (Interquartile Range)
  outlier_detection_method: "iqr"
  
  # Outlier threshold (number of standard deviations or IQR multiplier)
  # Default: 1.5 (for IQR method)
  outlier_threshold: 1.5

# =============================================================================
# REPORT GENERATION SECTION
# =============================================================================
# Configuration for test report generation
report:
  # List of report formats to generate
  # Supported values: "allure", "iso29119-3", "json", "html", "csv"
  # Default: ["allure", "json"]
  formats:
    - "allure"
    - "json"
    - "html"
  
  # Output directory for reports
  # Relative to project root
  # Default: "results/reports"
  output_dir: "results/reports"
  
  # Include PCAP samples in reports
  # WARNING: Can significantly increase report size
  # Default: false
  include_pcap_samples: false
  
  # Maximum number of PCAP samples to include
  # Default: 10 samples
  max_pcap_samples: 10
  
  # Generate trend analysis reports
  # Compares results across multiple test runs
  # Default: true
  generate_trends: true
  
  # Number of historical runs to include in trend analysis
  # Default: 10 runs
  trend_history_runs: 10
  
  # Include detailed statistics in reports
  # Default: true
  include_detailed_stats: true
  
  # Include graphs and charts in reports
  # Default: true
  include_graphs: true
  
  # Graph types to generate
  # Supported values: "distribution", "timeline", "heatmap", "scatter"
  # Default: ["distribution", "timeline"]
  graph_types:
    - "distribution"
    - "timeline"
    - "heatmap"
  
  # Report title
  # Default: "ECMP Hash Validation Test Report"
  title: "ECMP Hash Validation Test Report"
  
  # Include executive summary
  # Default: true
  include_executive_summary: true
  
  # Include recommendations section
  # Default: true
  include_recommendations: true
  
  # Include raw data appendix
  # Default: false
  include_raw_data: false

# =============================================================================
# RFC COMPLIANCE SECTION
# =============================================================================
# References to relevant RFCs for compliance tracking
rfc_compliance:
  # List of relevant RFCs
  # Each RFC should include number, title, and relevance
  rfcs:
    - number: "RFC 2991"
      title: "Multipath Issues in Unicast and Multicast Next-Hop Selection"
      relevance: "Describes issues and considerations for ECMP implementation"
      url: "https://tools.ietf.org/html/rfc2991"
    
    - number: "RFC 2992"
      title: "Analysis of an Equal-Cost Multi-Path Algorithm"
      relevance: "Provides mathematical analysis of ECMP hash algorithms"
      url: "https://tools.ietf.org/html/rfc2992"
    
    - number: "RFC 2330"
      title: "Framework for IP Performance Metrics"
      relevance: "Defines metrics and methodology for performance testing"
      url: "https://tools.ietf.org/html/rfc2330"
    
    - number: "RFC 2544"
      title: "Benchmarking Methodology for Network Interconnect Devices"
      relevance: "Provides standard benchmarking methodology"
      url: "https://tools.ietf.org/html/rfc2544"
    
    - number: "RFC 768"
      title: "User Datagram Protocol"
      relevance: "Defines UDP protocol for traffic generation"
      url: "https://tools.ietf.org/html/rfc768"
    
    - number: "RFC 791"
      title: "Internet Protocol"
      relevance: "Defines IP protocol for packet structure"
      url: "https://tools.ietf.org/html/rfc791"
    
    - number: "RFC 793"
      title: "Transmission Control Protocol"
      relevance: "Defines TCP protocol for traffic generation"
      url: "https://tools.ietf.org/html/rfc793"
    
    - number: "RFC 792"
      title: "Internet Control Message Protocol"
      relevance: "Defines ICMP protocol for traffic generation"
      url: "https://tools.ietf.org/html/rfc792"
  
  # Enable RFC compliance checking
  # Default: true
  enable_compliance_check: true
  
  # Warn on non-compliant behavior
  # Default: true
  warn_on_non_compliance: true

# =============================================================================
# TEST SCENARIOS SECTION
# =============================================================================
# Predefined test scenarios with specific parameters
scenarios:
  # Scenario 1: Basic ECMP distribution test
  - name: "basic_distribution"
    description: "Test basic ECMP distribution with all source hosts"
    enabled: true
    parameters:
      sources: ["h1", "h2", "h3", "h4"]
      duration_sec: 60
      packets_per_src: 1000
      expected_paths: 4
      tolerance_percent: 10.0
      hash_policy: "src-ip"
    
  # Scenario 2: Single source host test
  - name: "single_source"
    description: "Test ECMP distribution with single source host"
    enabled: true
    parameters:
      sources: ["h1"]
      duration_sec: 30
      packets_per_src: 1000
      expected_paths: 4
      tolerance_percent: 10.0
      hash_policy: "src-ip"
    
  # Scenario 3: High volume test
  - name: "high_volume"
    description: "Test ECMP distribution with high traffic volume"
    enabled: true
    parameters:
      sources: ["h1", "h2", "h3", "h4"]
      duration_sec: 120
      packets_per_src: 2500
      expected_paths: 4
      tolerance_percent: 10.0
      hash_policy: "src-ip"
    
  # Scenario 4: Burst traffic test
  - name: "burst_traffic"
    description: "Test ECMP distribution with burst traffic pattern"
    enabled: false
    parameters:
      sources: ["h1", "h2", "h3", "h4"]
      duration_sec: 60
      packets_per_src: 1000
      expected_paths: 4
      tolerance_percent: 10.0
      hash_policy: "src-ip"
      burst_size: 100
      burst_interval_sec: 1
  
  # Scenario 5: 2-path ECMP test
  - name: "ecmp_2paths"
    description: "Test ECMP distribution with 2 paths"
    enabled: false
    parameters:
      sources: ["h1", "h2"]
      duration_sec: 60
      packets_per_src: 1000
      expected_paths: 2
      tolerance_percent: 10.0
      hash_policy: "src-ip"
      topology_file: "topology/clab-ecmp-2paths.yml"
  
  # Scenario 6: 3-path ECMP test
  - name: "ecmp_3paths"
    description: "Test ECMP distribution with 3 paths"
    enabled: false
    parameters:
      sources: ["h1", "h2", "h3"]
      duration_sec: 60
      packets_per_src: 1000
      expected_paths: 3
      tolerance_percent: 10.0
      hash_policy: "src-ip"
      topology_file: "topology/clab-ecmp-3paths.yml"
  
  # Scenario 7: 5-tuple hash test
  - name: "hash_5tuple"
    description: "Test ECMP distribution with 5-tuple hash"
    enabled: false
    parameters:
      sources: ["h1", "h2", "h3", "h4"]
      duration_sec: 60
      packets_per_src: 1000
      expected_paths: 4
      tolerance_percent: 10.0
      hash_policy: "5-tuple"
      protocol: "tcp"
      source_port: 0
  
  # Scenario 8: ICMP traffic test
  - name: "icmp_traffic"
    description: "Test ECMP distribution with ICMP traffic"
    enabled: false
    parameters:
      sources: ["h1", "h2", "h3", "h4"]
      duration_sec: 60
      packets_per_src: 1000
      expected_paths: 4
      tolerance_percent: 10.0
      hash_policy: "src-ip"
      protocol: "icmp"
  
  # Scenario 9: Path stickiness test
  - name: "path_stickiness"
    description: "Test path stickiness for flows"
    enabled: false
    parameters:
      sources: ["h1", "h2"]
      duration_sec: 60
      packets_per_src: 2000
      expected_paths: 4
      tolerance_percent: 10.0
      hash_policy: "5-tuple"
      protocol: "tcp"
      enable_stickiness_check: true
      stickiness_threshold_percent: 95.0
  
  # Scenario 10: Stress test
  - name: "stress_test"
    description: "Stress test with maximum traffic load"
    enabled: false
    parameters:
      sources: ["h1", "h2", "h3", "h4"]
      duration_sec: 300
      packets_per_src: 5000
      expected_paths: 4
      tolerance_percent: 15.0
      hash_policy: "src-ip"
      interval_ms: 1

# =============================================================================
# LOGGING CONFIGURATION SECTION
# =============================================================================
# Logging configuration for test execution
logging:
  # Log level: debug, info, warn, error
  # Default: "info"
  # Recommended: "debug" during development, "info" in production
  level: "info"
  
  # Log file path
  # Relative to project root
  # Default: "logs/test_execution.log"
  file: "logs/test_execution.log"
  
  # Enable console output
  # Default: true
  console: true
  
  # Log format: text, json
  # Default: "text"
  # Recommended: "json" for automated processing, "text" for human reading
  format: "text"
  
  # Include timestamps in logs
  # Default: true
  timestamps: true
  
  # Include log level in output
  # Default: true
  include_level: true
  
  # Include source file and line number
  # Default: false
  include_source: false
  
  # Maximum log file size in MB before rotation
  # Default: 100 MB
  max_file_size_mb: 100
  
  # Number of backup log files to keep
  # Default: 5
  backup_count: 5

# =============================================================================
# CI/CD INTEGRATION SECTION
# =============================================================================
# Configuration for continuous integration/continuous deployment
ci_cd:
  # Enable CI/CD mode (non-interactive)
  # Default: false
  # Recommended: true in CI/CD pipelines
  enabled: false
  
  # Exit on first error
  # Default: true
  # Recommended: true for CI/CD, false for local testing
  fail_fast: true
  
  # Generate Allure report
  # Default: true
  generate_report: true
  
  # Allure results directory
  # Relative to project root
  # Default: "results/allure-results"
  allure_results_dir: "results/allure-results"
  
  # Cleanup after test completion
  # Default: true
  # Recommended: true in CI/CD, false for debugging
  cleanup: true
  
  # Preserve capture files
  # Default: true
  # Recommended: true for debugging, false to save space
  preserve_captures: true
  
  # Upload artifacts to artifact storage
  # Default: false
  upload_artifacts: false
  
  # Artifact storage URL
  # Example: "s3://my-bucket/test-results/"
  artifact_url: ""
  
  # Send notifications on test completion
  # Default: false
  send_notifications: false
  
  # Notification channels
  # Supported values: "email", "slack", "webhook"
  notification_channels: []
  
  # Notification webhook URL
  webhook_url: ""

# =============================================================================
# ADVANCED CONFIGURATION SECTION
# =============================================================================
# Advanced configuration options for power users
advanced:
  # Enable experimental features
  # Default: false
  enable_experimental: false
  
  # Custom configuration file paths
  # These override default configurations
  custom_configs:
    traffic: "configs/traffic/traffic_config.yaml"
    allure: "configs/allure/allure_config.yaml"
    topology: "topology/clab-ecmp-test.yml"
  
  # Environment-specific overrides
  # These can be used to customize configuration for different environments
  environments:
    development:
      verbose: true
      logging:
        level: "debug"
      ci_cd:
        enabled: false
        cleanup: false
    
    testing:
      verbose: false
      logging:
        level: "info"
      ci_cd:
        enabled: true
        cleanup: true
    
    production:
      verbose: false
      logging:
        level: "warn"
      ci_cd:
        enabled: true
        cleanup: true
        preserve_captures: false
  
  # Performance tuning
  performance:
    # Maximum parallel processes for traffic generation
    # Default: 4
    max_parallel_processes: 4
    
    # Memory limit for analysis in MB
    # Default: 1024 MB (1 GB)
    memory_limit_mb: 1024
    
    # Timeout for network operations in seconds
    # Default: 30 seconds
    network_timeout_sec: 30
    
    # Retry count for failed operations
    # Default: 3
    retry_count: 3
    
    # Retry delay in seconds
    # Default: 5 seconds
    retry_delay_sec: 5
  
  # Feature flags
  features:
    # Enable real-time monitoring
    # Default: false
    enable_realtime_monitoring: false
    
    # Enable automatic topology discovery
    # Default: false
    enable_auto_discovery: false
    
    # Enable machine learning for anomaly detection
    # Default: false
    enable_ml_anomaly_detection: false
    
    # Enable distributed testing across multiple hosts
    # Default: false
    enable_distributed_testing: false

