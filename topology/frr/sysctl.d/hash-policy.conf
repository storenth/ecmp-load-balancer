# Kernel ECMP Hash Policy Configuration
#
# This file configures the Linux kernel's ECMP (Equal-Cost Multi-Path) hash policy
# for consistent traffic distribution across multiple paths.
#
# Reference: https://www.kernel.org/doc/Documentation/networking/ip-sysctl.txt
# Architecture: ARCHITECTURE.md
#
# Hash Policy Values:
# 0 - Layer 3 (Source IP, Destination IP)
# 1 - Layer 4 (Source IP, Destination IP, Source Port, Destination Port)
# 2 - Layer 3 + Ingress Interface
# 3 - Custom (Source IP only - for testing purposes)
#
# For ECMP hash testing with Source IP only, we use policy 1 (Layer 4)
# which provides better distribution while still being deterministic.

# Set ECMP hash policy to Layer 4 (Source IP, Destination IP, Source Port, Destination Port)
# This provides good distribution while maintaining consistency for flows
net.ipv4.fib_multipath_hash_policy = 1

# Enable ECMP support
net.ipv4.fib_multipath = 1

# Maximum number of ECMP paths (should match or exceed num_paths in topology)
net.ipv4.fib_multipath_hash_fields = 1

# Enable reverse path filtering for security
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Disable source validation for ECMP (required for asymmetric routing)
net.ipv4.conf.all.rp_filter = 0
net.ipv4.conf.default.rp_filter = 0

# Enable IP forwarding (required for routing)
net.ipv4.ip_forward = 1

# Increase route cache size for better performance with multiple paths
net.ipv4.route.max_size = 8192

# Enable TCP Fast Open for better performance
net.ipv4.tcp_fastopen = 3

# TCP buffer sizes for better throughput
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# TCP congestion control algorithm
net.ipv4.tcp_congestion_control = cubic

# Enable TCP timestamps for better RTT measurements
net.ipv4.tcp_timestamps = 1

# Enable TCP selective acknowledgments
net.ipv4.tcp_sack = 1

# Enable TCP window scaling
net.ipv4.tcp_window_scaling = 1
