name: ECMP Testing CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      path_count:
        description: 'Number of ECMP paths to test'
        required: false
        default: '4'
        type: choice
        options:
          - '2'
          - '3'
          - '4'
      hash_policy:
        description: 'Hash policy to use'
        required: false
        default: 'L4'
        type: choice
        options:
          - 'L3'
          - 'L4'
      verbose:
        description: 'Enable verbose logging'
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC

env:
  CONFIG_FILE: config/test_config.yaml
  TOPOLOGY_FILE: topology/clab-ecmp-test.yml
  RESULTS_DIR: results
  VERBOSE: true

jobs:
  lint-and-validate:
    name: Lint and Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black yamllint

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Run flake8 linter
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: false

      - name: Check code formatting with black
        run: |
          black --check --diff scripts/
        continue-on-error: true

      - name: Validate YAML files
        run: |
          yamllint -c .yamllint config/ topology/ configs/ || true
        continue-on-error: true

      - name: Validate topology files
        run: |
          # Install containerlab for validation
          curl -sL https://github.com/srl-labs/containerlab/releases/download/v0.50.0/containerlab_0.50.0_linux_amd64.deb -o containerlab.deb
          sudo dpkg -i containerlab.deb || sudo apt-get install -f -y
          
          # Validate topology files
          for topo in topology/clab-*.yml; do
            echo "Validating $topo"
            containerlab topology validate -t "$topo" || echo "Warning: Validation failed for $topo"
          done
        continue-on-error: true

      - name: Check shell scripts
        run: |
          # Install shellcheck
          sudo apt-get update
          sudo apt-get install -y shellcheck
          
          # Check all shell scripts
          find scripts/ -name "*.sh" -exec shellcheck {} \;
        continue-on-error: true

      - name: Validate Python syntax
        run: |
          python -m py_compile scripts/*.py
        continue-on-error: false

  deploy-topology:
    name: Deploy Topology
    runs-on: ubuntu-latest
    needs: lint-and-validate
    timeout-minutes: 30
    
    strategy:
      matrix:
        path_count: [2, 3, 4]
        hash_policy: ['L3', 'L4']
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Install containerlab
        run: |
          curl -sL https://github.com/srl-labs/containerlab/releases/download/v0.50.0/containerlab_0.50.0_linux_amd64.deb -o containerlab.deb
          sudo dpkg -i containerlab.deb || sudo apt-get install -f -y
          containerlab version

      - name: Render topology templates
        run: |
          python scripts/render_topology.py \
            --paths ${{ matrix.path_count }} \
            --hash-policy ${{ matrix.hash_policy }} \
            --output topology/clab-ecmp-${{ matrix.path_count }}paths-${{ matrix.hash_policy }}.yml

      - name: Deploy topology
        run: |
          TOPO_FILE="topology/clab-ecmp-${{ matrix.path_count }}paths-${{ matrix.hash_policy }}.yml"
          containerlab deploy -t "$TOPO_FILE" --reconfigure
        timeout-minutes: 10

      - name: Wait for containers to be ready
        run: |
          echo "Waiting for containers to be ready..."
          sleep 30
          
          # Check if all containers are running
          docker ps --format "{{.Names}}" | grep -E "clab-ecmp" || exit 1
          
          # Wait for FRR to be ready
          for container in $(docker ps --format "{{.Names}}" | grep -E "r[1-6]"); do
            echo "Checking $container..."
            docker exec "$container" vtysh -c "show ip route" || exit 1
          done
        timeout-minutes: 5

      - name: Verify deployment
        run: |
          # Verify all nodes are up
          docker ps --format "table {{.Names}}\t{{.Status}}"
          
          # Verify connectivity
          docker exec clab-ecmp-h1 ping -c 3 10.0.0.2 || echo "Warning: H1 to R1 connectivity issue"
          docker exec clab-ecmp-h2 ping -c 3 10.0.0.6 || echo "Warning: H2 to R4 connectivity issue"

      - name: Save deployment info
        run: |
          mkdir -p ${{ env.RESULTS_DIR }}/deployment
          docker ps --format "{{.Names}}" > ${{ env.RESULTS_DIR }}/deployment/containers-${{ matrix.path_count }}paths-${{ matrix.hash_policy }}.txt
          docker network ls > ${{ env.RESULTS_DIR }}/deployment/networks-${{ matrix.path_count }}paths-${{ matrix.hash_policy }}.txt

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-info-${{ matrix.path_count }}paths-${{ matrix.hash_policy }}
          path: ${{ env.RESULTS_DIR }}/deployment/
          retention-days: 30

  run-tests:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: deploy-topology
    timeout-minutes: 45
    
    strategy:
      matrix:
        path_count: [2, 3, 4]
        hash_policy: ['L3', 'L4']
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create results directory
        run: |
          mkdir -p ${{ env.RESULTS_DIR }}/{captures,analysis,reports,allure-results}

      - name: Configure ECMP
        run: |
          bash scripts/configure_ecmp.sh \
            --paths ${{ matrix.path_count }} \
            --hash-policy ${{ matrix.hash_policy }} \
            --config ${{ env.CONFIG_FILE }}
        env:
          VERBOSE: ${{ env.VERBOSE }}

      - name: Start traffic capture
        run: |
          bash scripts/capture_traffic.sh \
            --output ${{ env.RESULTS_DIR }}/captures \
            --duration 60
        env:
          VERBOSE: ${{ env.VERBOSE }}

      - name: Generate test traffic
        run: |
          python scripts/traffic_gen.py \
            --config ${{ env.CONFIG_FILE }} \
            --paths ${{ matrix.path_count }} \
            --hash-policy ${{ matrix.hash_policy }} \
            --duration 60
        env:
          VERBOSE: ${{ env.VERBOSE }}

      - name: Stop traffic capture
        run: |
          pkill -f tcpdump || true
          echo "Traffic capture stopped"

      - name: Analyze results
        run: |
          python scripts/analyzer.py \
            --input ${{ env.RESULTS_DIR }}/captures \
            --output ${{ env.RESULTS_DIR }}/analysis \
            --paths ${{ matrix.path_count }} \
            --hash-policy ${{ matrix.hash_policy }}
        env:
          VERBOSE: ${{ env.VERBOSE }}

      - name: Generate test results
        run: |
          bash scripts/run_test.sh \
            --config ${{ env.CONFIG_FILE }} \
            --output ${{ env.RESULTS_DIR }} \
            --paths ${{ matrix.path_count }} \
            --hash-policy ${{ matrix.hash_policy }}
        env:
          VERBOSE: ${{ env.VERBOSE }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.path_count }}paths-${{ matrix.hash_policy }}
          path: |
            ${{ env.RESULTS_DIR }}/captures/
            ${{ env.RESULTS_DIR }}/analysis/
          retention-days: 30

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.path_count }}paths-${{ matrix.hash_policy }}
          path: ${{ env.RESULTS_DIR }}/allure-results/
          retention-days: 30

  generate-reports:
    name: Generate Reports
    runs-on: ubuntu-latest
    needs: run-tests
    timeout-minutes: 20
    
    strategy:
      matrix:
        path_count: [2, 3, 4]
        hash_policy: ['L3', 'L4']
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: ${{ env.RESULTS_DIR }}/
          merge-multiple: true

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: ${{ env.RESULTS_DIR }}/allure-results/
          merge-multiple: true

      - name: Generate Allure report
        run: |
          bash scripts/generate_allure_report.sh \
            --input ${{ env.RESULTS_DIR }}/allure-results \
            --output ${{ env.RESULTS_DIR }}/reports/allure
        continue-on-error: true

      - name: Generate ISO 29119-3 report
        run: |
          python scripts/report_gen.py \
            --format iso29119 \
            --input ${{ env.RESULTS_DIR }}/analysis \
            --output ${{ env.RESULTS_DIR }}/reports/iso29119 \
            --paths ${{ matrix.path_count }} \
            --hash-policy ${{ matrix.hash_policy }}
        continue-on-error: true

      - name: Generate JSON report
        run: |
          python scripts/report_gen.py \
            --format json \
            --input ${{ env.RESULTS_DIR }}/analysis \
            --output ${{ env.RESULTS_DIR }}/reports/json \
            --paths ${{ matrix.path_count }} \
            --hash-policy ${{ matrix.hash_policy }}

      - name: Generate HTML report
        run: |
          python scripts/report_gen.py \
            --format html \
            --input ${{ env.RESULTS_DIR }}/analysis \
            --output ${{ env.RESULTS_DIR }}/reports/html \
            --paths ${{ matrix.path_count }} \
            --hash-policy ${{ matrix.hash_policy }}

      - name: Upload reports as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.path_count }}paths-${{ matrix.hash_policy }}
          path: ${{ env.RESULTS_DIR }}/reports/
          retention-days: 30

      - name: Generate summary
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Path Count:** ${{ matrix.path_count }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Hash Policy:** ${{ matrix.hash_policy }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Reports have been generated and uploaded as artifacts." >> $GITHUB_STEP_SUMMARY

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: deploy-topology
    if: always()
    timeout-minutes: 10
    
    strategy:
      matrix:
        path_count: [2, 3, 4]
        hash_policy: ['L3', 'L4']
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install containerlab
        run: |
          curl -sL https://github.com/srl-labs/containerlab/releases/download/v0.50.0/containerlab_0.50.0_linux_amd64.deb -o containerlab.deb
          sudo dpkg -i containerlab.deb || sudo apt-get install -f -y

      - name: Destroy topology
        run: |
          TOPO_FILE="topology/clab-ecmp-${{ matrix.path_count }}paths-${{ matrix.hash_policy }}.yml"
          if [ -f "$TOPO_FILE" ]; then
            containerlab destroy -t "$TOPO_FILE" --cleanup || true
          fi
        continue-on-error: true

      - name: Clean up Docker resources
        run: |
          # Remove stopped containers
          docker container prune -f || true
          
          # Remove unused networks
          docker network prune -f || true
          
          # Clean up results
          rm -rf ${{ env.RESULTS_DIR }}/deployment || true
        continue-on-error: true

      - name: Verify cleanup
        run: |
          echo "Remaining containers:"
          docker ps -a || true
          echo ""
          echo "Remaining networks:"
          docker network ls || true

  status-check:
    name: Status Check
    runs-on: ubuntu-latest
    needs: [lint-and-validate, deploy-topology, run-tests, generate-reports]
    if: always()
    
    steps:
      - name: Check job statuses
        run: |
          echo "Lint and Validate: ${{ needs.lint-and-validate.result }}"
          echo "Deploy Topology: ${{ needs.deploy-topology.result }}"
          echo "Run Tests: ${{ needs.run-tests.result }}"
          echo "Generate Reports: ${{ needs.generate-reports.result }}"
          
          if [ "${{ needs.lint-and-validate.result }}" != "success" ] || \
             [ "${{ needs.deploy-topology.result }}" != "success" ] || \
             [ "${{ needs.run-tests.result }}" != "success" ] || \
             [ "${{ needs.generate-reports.result }}" != "success" ]; then
            echo "One or more jobs failed"
            exit 1
          fi

      - name: Generate workflow summary
        run: |
          echo "# ECMP Testing Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Statuses" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint and Validate | ${{ needs.lint-and-validate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Topology | ${{ needs.deploy-topology.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Run Tests | ${{ needs.run-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Generate Reports | ${{ needs.generate-reports.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Matrix" >> $GITHUB_STEP_SUMMARY
          echo "- Path Counts: 2, 3, 4" >> $GITHUB_STEP_SUMMARY
          echo "- Hash Policies: L3, L4" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All artifacts are available for download." >> $GITHUB_STEP_SUMMARY
