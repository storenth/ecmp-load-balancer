!
! FRRouting Configuration for Core Router R5 (ECMP Path 4)
! This router provides one of the 4 equal-cost paths in the ECMP topology
!
! Reference: https://docs.frrouting.org/
! Architecture: ARCHITECTURE.md
!

frr version 8.4_git
frr defaults traditional
hostname ecmp-core-router-r5
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!

! Interface configurations
interface eth0
 description Interface to Edge Router R1
 ip address 10.0.5.2/24
!
interface eth1
 description Interface to Destination Router R6
 ip address 10.0.9.1/24
!
interface lo
 description Loopback Interface
 ip address 10.0.5.1/32
!

! OSPF Configuration
router ospf
 ospf router-id 10.0.5.1
 network 10.0.5.0/24 area 0
 network 10.0.9.0/24 area 0
!

! Static Routes
ip route 10.0.1.0/24 10.0.5.1
ip route 192.168.100.0/24 10.0.9.2
!

! Line configuration
line vty
!
