# =============================================================================
# Quick Start Configuration for ECMP Hash Validation
# =============================================================================
#
# This is a simplified configuration for beginners who want to get started
# quickly with ECMP testing. It contains only the essential parameters
# needed to run a basic test.
#
# Usage:
#   make quick-test CONFIG=config/quick_start.yaml
#
# For more advanced features, see config/standard.yaml or config/advanced.yaml
#
# =============================================================================

# =============================================================================
# TEST METADATA
# =============================================================================
test:
  # Test name - identifies this test run
  name: "quick-ecmp-test"
  
  # Test duration in seconds (1 minute is good for quick testing)
  duration_sec: 60
  
  # Output directory for results
  output_dir: "results"

# =============================================================================
# TOPOLOGY CONFIGURATION
# =============================================================================
topology:
  # Number of ECMP paths (2, 3, or 4)
  # This determines how many paths traffic will be distributed across
  expected_paths: 4
  
  # Topology file to use
  # Available options:
  #   - topology/clab-ecmp-2paths.yml (2 paths)
  #   - topology/clab-ecmp-3paths.yml (3 paths)
  #   - topology/clab-ecmp-4paths.yml (4 paths)
  #   - topology/clab-ecmp-test.yml (default 4-path topology)
  topology_file: "topology/clab-ecmp-test.yml"
  
  # Destination IP address for test traffic
  # This is where all test traffic will be sent
  dst_ip: "10.0.10.10"

# =============================================================================
# TRAFFIC GENERATION
# =============================================================================
traffic:
  # Source IP range for traffic
  # Traffic will be generated from these IP addresses
  # Format: "start_ip-end_ip"
  src_ip_range: "10.0.1.10-10.0.1.13"
  
  # Number of packets to send per source IP
  # Higher values = more statistically significant results
  packets_per_src: 1000
  
  # Protocol type: icmp, tcp, or udp
  protocol: "tcp"
  
  # Destination port (for TCP/UDP traffic)
  destination_port: 80
  
  # Interval between packets in milliseconds
  # Lower = faster traffic generation
  interval_ms: 10

# =============================================================================
# ECMP CONFIGURATION
# =============================================================================
ecmp:
  # Hash algorithm for path selection
  # Options:
  #   - "src-ip": Hash based on source IP only (simplest)
  #   - "dst-ip": Hash based on destination IP only
  #   - "src-dst-ip": Hash based on both source and destination IP
  #   - "5-tuple": Hash based on full 5-tuple (most complex)
  hash_policy: "src-ip"
  
  # Expected number of ECMP paths (must match topology.expected_paths)
  expected_paths: 4
  
  # Acceptable deviation from uniform distribution (%)
  # Example: 10% means each path can vary by ±10% from ideal
  tolerance_percent: 10.0

# =============================================================================
# ANALYSIS CONFIGURATION
# =============================================================================
analysis:
  # Minimum total packets required for analysis
  min_packets: 1000
  
  # Minimum unique source IPs required
  min_unique_src_ips: 4
  
  # Statistical confidence level (0.95 = 95% confidence)
  confidence_level: 0.95
  
  # Enable chi-square test for distribution uniformity
  enable_chi_square: true

# =============================================================================
# REPORT CONFIGURATION
# =============================================================================
report:
  # Report formats to generate
  formats:
    - "allure"
    - "json"
  
  # Output directory for reports
  output_dir: "results/reports"
  
  # Include graphs in reports
  include_graphs: true

# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================
logging:
  # Log level: debug, info, warn, error
  level: "info"
  
  # Log file path
  file: "logs/test_execution.log"
  
  # Enable console output
  console: true

# =============================================================================
# END OF QUICK START CONFIGURATION
# =============================================================================
#
# Next Steps:
#   1. Run: make quick-test
#   2. View results: make open-report
#   3. For more features: see config/standard.yaml
#
# =============================================================================
