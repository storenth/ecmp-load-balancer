!
! FRRouting Configuration for Destination Router R6
! This router connects to all core routers and the destination network
!
! Reference: https://docs.frrouting.org/
! Architecture: ARCHITECTURE.md
!

frr version 8.4_git
frr defaults traditional
hostname ecmp-destination-router-r6
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!

! Interface configurations
interface eth0
 description Interface to Core Router R2
 ip address 10.0.6.2/24
!
interface eth1
 description Interface to Core Router R3
 ip address 10.0.7.2/24
!
interface eth2
 description Interface to Core Router R4
 ip address 10.0.8.2/24
!
interface eth3
 description Interface to Core Router R5
 ip address 10.0.9.2/24
!
interface eth4
 description Destination Network Interface
 ip address 192.168.100.1/24
!
interface lo
 description Loopback Interface
 ip address 192.168.100.1/32
!

! OSPF Configuration
router ospf
 ospf router-id 192.168.100.1
 network 10.0.6.0/24 area 0
 network 10.0.7.0/24 area 0
 network 10.0.8.0/24 area 0
 network 10.0.9.0/24 area 0
 network 192.168.100.0/24 area 0
 passive-interface eth4
!

! Static Routes
ip route 10.0.1.0/24 10.0.6.1
ip route 10.0.1.0/24 10.0.7.1
ip route 10.0.1.0/24 10.0.8.1
ip route 10.0.1.0/24 10.0.9.1
!

! Line configuration
line vty
!
