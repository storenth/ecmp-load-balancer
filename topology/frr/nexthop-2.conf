!
! FRRouting Configuration for Core Router R3 (ECMP Path 2)
! This router provides one of the 4 equal-cost paths in the ECMP topology
!
! Reference: https://docs.frrouting.org/
! Architecture: ARCHITECTURE.md
!

frr version 8.4_git
frr defaults traditional
hostname ecmp-core-router-r3
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!

! Interface configurations
interface eth0
 description Interface to Edge Router R1
 ip address 10.0.3.2/24
!
interface eth1
 description Interface to Destination Router R6
 ip address 10.0.7.1/24
!
interface lo
 description Loopback Interface
 ip address 10.0.3.1/32
!

! OSPF Configuration
router ospf
 ospf router-id 10.0.3.1
 network 10.0.3.0/24 area 0
 network 10.0.7.0/24 area 0
!

! Static Routes
ip route 10.0.1.0/24 10.0.3.1
ip route 192.168.100.0/24 10.0.7.2
!

! BGP Configuration for advertising destination network
router bgp 65002
 bgp router-id 10.0.3.1
 neighbor 10.0.3.1 remote-as 65001
!
 address-family ipv4 unicast
  neighbor 10.0.3.1 activate
  network 192.168.100.0/24
 exit-address-family
!

! Line configuration
line vty
!